name: iOS build (experimental)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Create placeholder resources
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          let res = (conf.bundle && conf.bundle.resources) || [];
          if (!Array.isArray(res)) res = Object.keys(res);
          for (const p of res) {
            if (p.includes('*')) continue;
            const f = path.join('src-tauri', p);
            if (!fs.existsSync(f)) {
              fs.mkdirSync(path.dirname(f), { recursive: true });
              fs.writeFileSync(f, '');
              console.log('placeholder:', f);
            }
          }
          EOF

      - name: Init iOS project
        run: pnpm tauri ios init --ci

      - name: Build iOS app (unsigned)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/nosign.xcconfig" <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =
          EOF
          export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/nosign.xcconfig"
          pnpm tauri ios build --ci --export-method debugging

      - name: Package IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" -path "*iphoneos*" | head -n 1)
          echo "App: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qr ../app-unsigned.ipa Payload)

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            app-unsigned.ipa
            src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn
